<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>聚合搜索</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>聚合搜索</h1>
    <input type="text" id="query" placeholder="输入搜索关键词">
    <div class="platforms">
      <label><input type="checkbox" value="xiaohongshu" checked>小红书</label>
      <label><input type="checkbox" value="baidu" checked>百度</label>
      <label><input type="checkbox" value="douyin" checked>抖音</label>
      <label><input type="checkbox" value="bilibili" checked>哔哩哔哩</label>
    </div>
    <button id="searchBtn">搜索</button>
    <button id="openAllBtn" style="display:none;">全部打开</button>
    <ul id="results"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
